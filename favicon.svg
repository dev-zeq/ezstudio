<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <!-- gradientes dos feixes de cor -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="bl">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Fundo arredondado escuro -->
  <rect width="32" height="32" rx="7" fill="url(#gb)"/>

  <!-- Feixe de entrada (luz branca) -->
  <rect x="2" y="15.2" width="9" height="1.6" rx="0.8"
        fill="white" opacity="0.7"/>

  <!-- Prisma (triângulo de vidro) -->
  <polygon points="11,8 11,24 18,16"
           fill="white" fill-opacity="0.12"
           stroke="white" stroke-opacity="0.55" stroke-width="0.9"
           stroke-linejoin="round"/>
  <!-- reflexo interno -->
  <line x1="11.5" y1="9.5" x2="11.5" y2="15"
        stroke="white" stroke-opacity="0.4" stroke-width="0.6"
        stroke-linecap="round"/>

  <!-- Feixes de saída do espectro -->
  <!-- cyan  – sobe -->
  <rect x="18" y="8.5" width="11" height="1.6" rx="0.8"
        fill="url(#g1)" filter="url(#bl)"
        transform="rotate(-20 18 16)"/>
  <!-- violet – central -->
  <rect x="18" y="15.2" width="11" height="1.6" rx="0.8"
        fill="url(#g2)" filter="url(#bl)"/>
  <!-- pink  – desce -->
  <rect x="18" y="22" width="11" height="1.6" rx="0.8"
        fill="url(#g3)" filter="url(#bl)"
        transform="rotate(20 18 16)"/>

  <!-- Pontos de luz na ponta -->
  <circle cx="29" cy="9.5"  r="1.2" fill="#06b6d4"/>
  <circle cx="29" cy="16"   r="1.2" fill="#8b5cf6"/>
  <circle cx="29" cy="22.5" r="1.2" fill="#ec4899"/>
</svg>
